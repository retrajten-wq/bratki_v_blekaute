<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Фон-круг -->
  <circle cx="160" cy="160" r="160" fill="#1a1619"/>

  <!-- Тонкое кольцо-рамка -->
  <circle cx="160" cy="160" r="150" fill="none" stroke="#4a2e35" stroke-width="4"/>

  <!-- Силуэт: голова -->
  <circle cx="160" cy="120" r="52" fill="#2d2226"/>

  <!-- Силуэт: плечи -->
  <path d="M60 300
           C60 220 100 190 160 190
           C220 190 260 220 260 300
           Z" fill="#2d2226"/>

  <!-- Бургунди-акцент: воротник / шарф -->
  <path d="M120 230
           Q160 260 200 230
           L210 250
           Q160 290 110 250
           Z" fill="#6b1f2e"/>

  <!-- Лёгкий блик на голове -->
  <circle cx="140" cy="100" r="14" fill="#3a2c30" opacity="0.6"/>

  <!-- Декоративные «искры блэкаута» -->
  <circle cx="60" cy="70" r="4" fill="#c9a9a6" opacity="0.7"/>
  <circle cx="250" cy="90" r="3" fill="#c9a9a6" opacity="0.5"/>
  <circle cx="270" cy="230" r="2.5" fill="#c9a9a6" opacity="0.4"/>
  <circle cx="45" cy="240" r="3" fill="#c9a9a6" opacity="0.5"/>
</svg>